<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 시간표에 맞는 두 번째 일 | 두번째성장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --g900: #191F28; --g800: #333D4B; --g700: #4E5968; --g600: #6B7684; --g500: #8B95A1;
    --g300: #D1D6DB; --g200: #E5E8EB; --g100: #F2F4F6; --g50: #F9FAFB;
    --pri: #EE5D22; --pri-d: #D44A12; --pri-50: #FFF3ED; --pri-100: #FFE4D6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: "Pretendard", -apple-system, "Noto Sans KR", sans-serif; color: var(--g900); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
  button { font-family: inherit; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; display: flex; flex-direction: column; }
  .nav { height: 52px; display: flex; align-items: center; padding: 0 20px; gap: 8px; position: sticky; top: 0; background: #fff; z-index: 5; }
  .nav .back { width: 32px; height: 32px; margin-left: -8px; border: 0; background: none; cursor: pointer; display: none; align-items: center; justify-content: center; border-radius: 8px; }
  .nav .back.on { display: flex; }
  .nav .back svg { width: 22px; height: 22px; }
  .nav .title { font-size: 16px; font-weight: 600; color: var(--g900); }
  .nav .badge { font-size: 12px; font-weight: 600; color: var(--g600); background: var(--g100); padding: 3px 7px; border-radius: 6px; }
  .progress { height: 3px; background: var(--g100); margin: 0 20px; border-radius: 2px; overflow: hidden; display: none; }
  .progress.on { display: block; }
  .progress i { display: block; height: 100%; width: 0; background: var(--pri); transition: width .35s cubic-bezier(.2,.7,.3,1); }

  .screen { display: none; flex: 1; flex-direction: column; padding: 0 20px; animation: in .35s cubic-bezier(.2,.7,.3,1); }
  .screen.on { display: flex; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .ill { display: block; object-fit: contain; }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .cta-wrap { position: sticky; bottom: 0; margin: auto -20px 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(255,255,255,0), #fff 30%); z-index: 4; }
  .btn { width: 100%; height: 56px; border: 0; border-radius: 16px; background: var(--pri); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; transition: transform .1s, background .15s; }
  .btn:active { transform: scale(.98); background: var(--pri-d); }

  /* 한 화면 한 메시지 */
  .hero1 { margin: auto 0; padding: 0 0 40px; text-align: center; }
  .hero1 .ill { width: 168px; height: 168px; margin: 0 auto 28px; }
  .hero1 h1 { font-size: 28px; margin-bottom: 10px; }
  .hero1 .lead { color: var(--g600); }
  .kvbox { margin-top: 28px; background: var(--g50); border-radius: 20px; padding: 8px 20px; }
  .kvbox .kv { padding: 15px 0; font-size: 17px; border-bottom: 1px solid var(--g100); }
  .kvbox .kv:last-child { border-bottom: 0; }
  #r-nums { margin-top: 24px; }
  #r-nums .big { padding: 14px 0; border-bottom: 1px solid var(--g100); }
  #r-nums .big:last-of-type { border-bottom: 0; }
  .honest { font-size: 16px; line-height: 1.65; color: var(--g700); margin: 20px 0 0; }
  .honest b { color: var(--g900); }
  .todos { margin-top: 20px; }
  .todos .todo { font-size: 17px; padding: 16px 0; border-bottom: 1px solid var(--g100); }
  .todos .todo:last-child { border-bottom: 0; }
  .cells { margin-top: 20px; }
  .btn.ghost { background: none; color: var(--g600); height: 48px; margin-top: 4px; font-weight: 500; }
  .btn.ghost:active { background: var(--g100); transform: none; }

  /* 시작 */
  .intro { padding-top: 20px; }
  .intro .ill { width: 132px; height: 132px; margin: 8px 0 20px; }
  h1 { font-size: 26px; line-height: 1.38; font-weight: 700; letter-spacing: -0.6px; margin: 0 0 10px; }
  h1 em { font-style: normal; color: var(--pri); }
  .lead { font-size: 17px; line-height: 1.55; color: var(--g700); margin: 0; }
  .feat { margin: 32px 0 8px; }
  .feat .row { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
  .feat .row img { width: 44px; height: 44px; flex: none; }
  .feat .row b { display: block; font-size: 16px; font-weight: 600; }
  .feat .row span { display: block; font-size: 14px; color: var(--g600); margin-top: 2px; }
  .note { font-size: 13px; color: var(--g500); text-align: center; margin: 8px 0 0; }

  /* 질문 */
  .qhead { padding-top: 28px; }
  .qhead .ill { width: 64px; height: 64px; margin-bottom: 16px; }
  .qhead h2 { font-size: 24px; line-height: 1.4; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
  .qhead p { font-size: 15px; color: var(--g600); margin: 8px 0 0; line-height: 1.5; }
  .opts { display: flex; flex-direction: column; gap: 8px; padding: 24px 0 32px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--g50); border: 0; box-shadow: inset 0 0 0 1px var(--g100); border-radius: 16px; padding: 16px 18px; cursor: pointer; transition: background .15s, box-shadow .15s, transform .1s; }
  .opt:active { transform: scale(.985); }
  .opt img { width: 36px; height: 36px; flex: none; }
  .opt .tx { flex: 1; min-width: 0; }
  .opt b { display: block; font-size: 17px; font-weight: 600; color: var(--g900); line-height: 1.4; }
  .opt small { display: block; font-size: 14px; color: var(--g600); margin-top: 2px; line-height: 1.4; }
  .opt .ck { width: 24px; height: 24px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--g300); display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .opt .ck svg { width: 14px; height: 14px; opacity: 0; }
  .opt.pick { background: var(--pri-50); box-shadow: inset 0 0 0 2px var(--pri); }
  .opt.pick .ck { background: var(--pri); box-shadow: none; }
  .opt.pick .ck svg { opacity: 1; }

  /* 중간, 분석 */
  .center { margin: auto 0; text-align: center; padding-bottom: 80px; }
  .center .ill { width: 140px; height: 140px; margin: 0 auto 24px; }
  .center h2 { font-size: 24px; line-height: 1.4; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 8px; }
  .center p { font-size: 16px; color: var(--g600); margin: 0; line-height: 1.5; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 20px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--pri-100); animation: dot 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%,100% { background: var(--pri-100); } 50% { background: var(--pri); } }

  /* 결과 */
  .res-top { text-align: center; padding: 24px 0 28px; }
  .res-top .ill { width: 128px; height: 128px; margin: 0 auto 16px; }
  .pill { display: inline-block; font-size: 14px; font-weight: 600; color: var(--pri-d); background: var(--pri-50); padding: 6px 12px; border-radius: 99px; margin-bottom: 12px; }
  .res-top h1 { margin-bottom: 8px; }
  .sec { margin: 0 -20px; padding: 28px 20px; border-top: 12px solid var(--g100); }
  .sec h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 16px; }
  .body { font-size: 16px; line-height: 1.65; color: var(--g700); margin: 0; }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 11px 0; font-size: 16px; }
  .kv span { color: var(--g600); flex: none; }
  .kv b { font-weight: 600; text-align: right; }
  .kv b.good { color: var(--pri-d); }
  .kv b.ok { color: var(--g800); }
  .big { padding: 12px 0; }
  .big span { display: block; font-size: 14px; color: var(--g600); margin-bottom: 4px; }
  .big b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .cap { font-size: 13px; color: var(--g500); margin: 10px 0 0; line-height: 1.5; }
  .tip { display: flex; gap: 12px; align-items: flex-start; background: var(--g50); box-shadow: inset 0 0 0 1px var(--g100); border-radius: 16px; padding: 16px; }
  .tip img { width: 32px; height: 32px; flex: none; }
  .tip p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--g700); }
  .tip p b { color: var(--g900); }
  .cell { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; padding: 12px 0; text-align: left; cursor: pointer; border-radius: 12px; }
  .cell:active { background: var(--g50); }
  .cell img { width: 48px; height: 48px; flex: none; }
  .cell .tx { flex: 1; min-width: 0; }
  .cell b { display: block; font-size: 17px; font-weight: 600; color: var(--g900); }
  .cell small { display: block; font-size: 14px; color: var(--g600); margin-top: 3px; line-height: 1.45; }
  .cell svg { width: 20px; height: 20px; flex: none; color: var(--g300); }
  .todo { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; padding: 12px 0; text-align: left; cursor: pointer; font-size: 16px; color: var(--g800); line-height: 1.5; }
  .todo .ck { width: 24px; height: 24px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--g300); display: flex; align-items: center; justify-content: center; }
  .todo .ck svg { width: 14px; height: 14px; opacity: 0; }
  .todo.done { color: var(--g500); }
  .todo.done .ck { background: var(--pri); box-shadow: none; }
  .todo.done .ck svg { opacity: 1; }
  .links { display: flex; justify-content: center; gap: 4px; padding: 20px 0 8px; }
  .links button { border: 0; background: none; font-size: 14px; color: var(--g600); padding: 8px 12px; cursor: pointer; border-radius: 8px; }
  .links button:active { background: var(--g100); }
  .foot { text-align: center; font-size: 13px; color: var(--g500); padding: 4px 0 16px; margin: 0; }

  /* 바텀시트 */
  .dim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .dim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 480px; transform: translate(-50%, 100%); background: #fff; border-radius: 24px 24px 0 0; padding: 12px 20px calc(20px + env(safe-area-inset-bottom)); transition: transform .3s cubic-bezier(.2,.7,.3,1); z-index: 21; }
  .sheet { visibility: hidden; transition: transform .3s cubic-bezier(.2,.7,.3,1), visibility 0s .3s; }
  .sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform .3s cubic-bezier(.2,.7,.3,1); }
  .sheet .grab { width: 36px; height: 4px; background: var(--g200); border-radius: 2px; margin: 0 auto 20px; }
  .sheet .ill { width: 72px; height: 72px; margin-bottom: 12px; }
  .sheet h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 8px; line-height: 1.4; }
  .sheet p { font-size: 15px; color: var(--g600); margin: 0 0 20px; line-height: 1.55; }
  .field { width: 100%; height: 56px; border: 0; background: var(--g100); border-radius: 14px; padding: 0 16px; font-size: 17px; font-family: inherit; color: var(--g900); outline: none; }
  .field:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--pri); }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--g600); margin: 14px 0 20px; line-height: 1.5; cursor: pointer; }
  .agree input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--pri); }
  .done-msg { display: none; margin-top: 12px; font-size: 14px; color: var(--g700); background: var(--g100); border-radius: 12px; padding: 14px; line-height: 1.55; }
  .done-msg.on { display: block; }
  @media (max-width: 360px) { h1 { font-size: 23px; } .qhead h2 { font-size: 21px; } }

  /* QA 보정 (CSS만) */
  :root { --pri-t: #B9420F; }
  .nav .badge { font-size: 13px; color: var(--g700); }
  .pill, .kv b.good { color: var(--pri-t); }
  .kvbox .kv span { color: var(--g700); }
  .note, .cap, .foot { color: var(--g600); }
  .cell small, .opt small { text-wrap: pretty; }
  .opts:has(.opt:nth-child(8)) { gap: 6px; padding-bottom: 20px; }
  .opts:has(.opt:nth-child(8)) .opt { padding-top: 12px; padding-bottom: 12px; }
  @media (max-height: 760px) {
    .qhead { padding-top: 16px; }
    .qhead .ill { width: 52px; height: 52px; margin-bottom: 12px; }
    #r-nums { margin-top: 16px; }
    #r-nums .big { padding: 11px 0; }
    .honest { margin-top: 14px; }
    .opts:has(.opt:nth-child(8)) { padding-top: 16px; padding-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <button class="back" id="back" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="title">두번째성장</span><span class="badge">샘플</span>
  </div>
  <div class="progress" id="progress"><i id="bar"></i></div>

  <!-- 시작 -->
  <section class="screen on" id="s-start">
    <div class="hero1">
      <img class="ill float" src="img/clock.png" alt="">
      <h1>내 시간표에 맞는<br><em>두 번째 일</em>은?</h1>
      <p class="lead">2분이면 알려 드려요</p>
    </div>
    <div class="cta-wrap"><button class="btn" id="go">시작하기</button></div>
  </section>

  <!-- 질문 -->
  <section class="screen" id="s-q">
    <div class="qhead">
      <img class="ill" id="q-ill" src="img/baby.png" alt="">
      <h2 id="q"></h2>
      <p id="qhint"></p>
    </div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- 중간 -->
  <section class="screen" id="s-mid">
    <div class="center">
      <img class="ill float" src="img/calendar.png" alt="">
      <h2>시간표를 다 봤어요</h2>
      <p>이제 어떤 일이 끌리는지 알려 주세요</p>
    </div>
  </section>

  <!-- 분석 -->
  <section class="screen" id="s-load">
    <div class="center">
      <img class="ill float" src="img/search.png" alt="">
      <h2 id="loadmsg">맞는 일을 찾고 있어요</h2>
      <p>18가지 일과 내 조건을 맞춰 보는 중</p>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </section>

  <!-- 결과 -->
  <!-- 결과 1: 한 줄 결론 -->
  <section class="screen" id="s-res">
    <div class="hero1">
      <img class="ill float" id="r-ill" src="img/cart.png" alt="">
      <div class="pill" id="r-type"></div>
      <h1 id="r-title"></h1>
      <p class="lead" id="r-one"></p>
    </div>
    <div class="cta-wrap"><button class="btn" data-go="s-r2">어떤 일인지 보기</button></div>
  </section>

  <!-- 결과 2: 내 조건 -->
  <section class="screen" id="s-r2">
    <div class="qhead">
      <img class="ill" id="r2-ill" src="img/check.png" alt="">
      <h2>내 조건과<br>맞춰 봤어요</h2>
    </div>
    <div class="kvbox" id="r-kv"></div>
    <div class="cta-wrap"><button class="btn" data-go="s-r3">진짜 숫자 보기</button></div>
  </section>

  <!-- 결과 3: 진짜 숫자 -->
  <section class="screen" id="s-r3">
    <div class="qhead">
      <img class="ill" src="img/money.png" alt="">
      <h2 id="r3-title">진짜 숫자로<br>말씀드릴게요</h2>
    </div>
    <div id="r-nums"></div>
    <div class="cta-wrap"><button class="btn" data-go="s-r4">이번 주에 해 볼 일</button></div>
  </section>

  <!-- 결과 4: 첫 걸음 -->
  <section class="screen" id="s-r4">
    <div class="qhead">
      <img class="ill" src="img/rocket.png" alt="">
      <h2>이번 주엔<br>이것만 해 보세요</h2>
    </div>
    <div class="todos" id="r-todo"></div>
    <div class="cta-wrap">
      <button class="btn" id="open-sheet">알림 받기</button>
      <button class="btn ghost" data-go="s-r5">다른 일도 보기</button>
    </div>
  </section>

  <!-- 결과 5: 다른 추천 -->
  <section class="screen" id="s-r5">
    <div class="qhead">
      <img class="ill" src="img/sparkles.png" alt="">
      <h2>이런 일도<br>잘 맞아요</h2>
    </div>
    <div class="cells" id="r-more"></div>
    <div class="links"><button id="again">처음부터 다시</button><button id="share">친구에게 공유</button></div>
  </section>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <img class="ill" src="img/bell.png" alt="">
  <h2 id="sh-title"></h2>
  <p id="sh-desc"></p>
  <input class="field" id="f-phone" inputmode="tel" placeholder="휴대폰 번호">
  <label class="agree"><input type="checkbox" id="f-agree"><span>안내 문자를 받기 위해 휴대폰 번호를 받아요. 안내가 끝나면 지웁니다.</span></label>
  <button class="btn" id="f-send">신청하기</button>
  <div class="done-msg" id="f-done">샘플 화면이라 번호는 저장되지 않아요. 실제 페이지에서는 저장이 확인된 뒤에만 신청 완료가 뜨고, 실패하면 다시 보내기와 카톡 문의가 함께 보여요.</div>
</div>

<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

const Q = [
  { ill: "baby", q: "막내 아이는 지금 몇 살인가요?", hint: "아이 나이에 따라 쓸 수 있는 시간이 달라져요",
    o: [["미취학", "0~7세", "kid_small"], ["초등학생", "", "kid_school"], ["중학생 이상", "", "kid_big"], ["아이는 없어요", "", "kid_none"]] },
  { ill: "clock", q: "하루 중 온전히 내 시간은|언제인가요?", hint: "가장 가까운 하나만 골라 주세요",
    o: [["등원 뒤 오전", "아이가 기관에 가 있는 시간", "am", "sun"], ["하원 전 오후에 짧게", "1~2시간 정도", "pm", "hourglass"], ["아이 잠든 밤", "밤 10시 이후", "night", "moon"], ["주말에만 조금", "평일은 어려워요", "weekend", "calendar"]] },
  { ill: "hourglass", q: "일주일에 쓸 수 있는 시간은|어느 정도인가요?", hint: "엄마 55명 중 38명이 5시간 이하라고 답했어요",
    o: [["3시간 미만", "", "h3"], ["3~5시간", "", "h5"], ["5~10시간", "", "h10"], ["10시간 이상", "", "h20"]] },
  { ill: "coin", q: "시작할 때 쓸 수 있는 돈은|어느 정도인가요?", hint: "교육비, 시험비, 장비, 상품처럼 시작하는 데 드는 돈이에요",

    cta: ["부동산 실장 원데이 체험 알림 받기", "현직 공인중개사님과 하루 동안 실제 업무를 해 보는 프로그램을 준비하고 있어요. 열리면 먼저 알려 드릴게요."] },
];

const SCORE_G = {
  g_sell: { sell: 6 }, g_show: { show: 6 }, g_care: { care: 6 }, g_pet: { pet: 6 }, g_connect: { connect: 6 }, g_office: { office: 6 }, g_teach: { teach: 6 }, g_make: { make: 6 },
  p_calc: { sell: 2, office: 1 }, p_show: { show: 2, connect: 1 }, p_steady: { office: 2, care: 1 }, p_listen: { care: 2, connect: 1 },
  p_teach: { teach: 2, connect: 1 }, p_hand: { make: 2, office: 1 }, p_animal: { pet: 3 },
};

let i = 0, ranked = [];
const ans = [];
const $ = (id) => document.getElementById(id);

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("on"));
  $(id).classList.add("on");
  $("progress").classList.toggle("on", id === "s-q");
  $("back").classList.toggle("on", id === "s-q" || id.indexOf("s-r") === 0 && id !== "s-load");
  window.scrollTo(0, 0);
}

function render() {
  const item = Q[i];
  $("q-ill").src = "img/" + item.ill + ".png";
  $("q").innerHTML = item.q.split("|").join("<br>");
  $("qhint").textContent = item.hint;
  $("qhint").style.display = i === Q.length - 1 ? "block" : "none";
  $("bar").style.width = ((i + 1) / Q.length * 100) + "%";
  const box = $("opts");
  box.innerHTML = "";
  item.o.forEach(([t, s, key, ic]) => {
    const b = document.createElement("button");
    b.className = "opt" + (ans[i] === key ? " pick" : "");
    b.innerHTML = (ic ? '<img src="img/' + ic + '.png" alt="">' : "") + '<span class="tx"><b>' + t + '</b></span><span class="ck">' + CHECK + "</span>";
    b.onclick = () => {
      ans[i] = key;
      box.querySelectorAll(".opt").forEach((o) => o.classList.remove("pick"));
      b.classList.add("pick");
      setTimeout(next, 260);
    };
    box.appendChild(b);
  });
}

function next() {
  if (i === 3) { i++; render(); show("s-mid"); setTimeout(() => show("s-q"), 1400); return; }
  if (i < Q.length - 1) { i++; render(); window.scrollTo(0, 0); return; }
  show("s-load");
  const msgs = ["맞는 일을 찾고 있어요", "시간과 돈을 맞춰 보고 있어요", "거의 다 됐어요"];
  let k = 0;
  $("loadmsg").textContent = msgs[0];
  const t = setInterval(() => { k++; if (k < msgs.length) $("loadmsg").textContent = msgs[k]; }, 800);
  setTimeout(() => { clearInterval(t); result(); }, 2400);
}

function scoreJob(j) {
  let s = 0;
  ans.forEach((a) => { const sc = SCORE_G[a]; if (sc && sc[j.g]) s += sc[j.g]; });
  const when = ans[1], hours = ans[2], money = ans[3], face = ans[6], out = ans[7], lic = ans[8];
  if (face === "face_no" && j.face) s -= 5;
  if (face === "face_half" && j.face) s -= 1;
  if (face === "face_ok" && j.face) s += 1;
  if (out === "out_no") s -= (j.place === "out" ? 5 : j.place === "near" ? 3 : 0);
  if (out === "out_near" && j.place === "out") s -= 2;
  if (out === "out_ok" && j.place !== "home") s += 1;
  if (lic === "lic_no") s -= (j.lic === 2 ? 5 : j.lic === 1 ? 2 : 0);
  if (lic === "lic_short" && j.lic === 2) s -= 2;
  if (lic === "lic_ok" && j.lic) s += 1;
  if (money === "m0") s -= j.cost * 2;
  if (money === "m50" && j.cost === 2) s -= 2;
  if ((when === "night" || when === "weekend") && j.fixed) s -= 3;
  if (when === "night" && j.place !== "home") s -= 2;
  if (hours === "h3" && j.fixed) s -= 1;
  if (j.id === "handmade" && ans[5] === "p_hand") s += 3;
  return s;
}

function kvRows(j) {
  const place = j.place === "home" ? ["집에서 해요", "good"] : j.place === "near" ? ["집 근처에서 해요", "ok"] : ["밖에 나가서 해요", "ok"];
  const time = j.fixed ? ["정해진 시간이 있어요", "ok"] : ["원하는 시간에 해요", "good"];
  const lic = j.lic === 2 ? ["국가자격이 필요해요", "ok"] : j.lic === 1 ? ["있으면 유리해요", "ok"] : ["필요 없어요", "good"];
  const cost = j.cost === 0 ? ["거의 안 들어요", "good"] : j.cost === 1 ? ["조금 들어요", "ok"] : ["교육비가 들어요", "ok"];
  const rows = [["일하는 곳", place], ["일하는 시간", time], ["자격증", lic], ["시작 비용", cost]];
  if (j.face) rows.push(["얼굴 노출", ["손이나 목소리로도 가능", "ok"]]);
  return rows.map(([k, [v, c]]) => '<div class="kv"><span>' + k + '</span><b class="' + c + '">' + v + "</b></div>").join("");
}

function honestText(j) {
  const lowTime = ["h3", "h5"].includes(ans[2]);
  const highHope = ["e200", "e300"].includes(ans[9]);
  if (j.id === "seller" && lowTime && highHope) return "<b>솔직하게 말씀드리면,</b> 주 5시간 이하로 3개월 안에 월 100만 원 이상은 쉽지 않아요. 처음엔 매출 100~300만 원, 남는 돈은 그 10% 안팎이 흔해요. 이 시기에 상품 하나를 제대로 파는 법을 익히면 그다음이 달라져요.";
  if (lowTime && highHope) return "<b>솔직하게 말씀드리면,</b> 주 5시간 이하로 3개월 안에 월 100만 원 이상은 쉽지 않아요. 엄마 55명 중 34명이 비슷하게 기대했어요. 첫 목표는 금액보다 \"멈추지 않고 3개월 해 보기\"를 권해요.";
  if (lowTime) return "<b>주 5시간이면 작게 시작하기 좋아요.</b> 엄마 55명 중 38명이 같은 조건이었어요. 한꺼번에 하기보다 매주 같은 시간에 한 가지씩 하는 게 오래 가요.";
  return "<b>시간이 넉넉한 건 큰 장점이에요.</b> 다만 혼자 하면 중간에 멈추기 쉬워요. 엄마들이 강의에서 가장 아쉬웠던 점도 \"혼자 실행하기 어려웠다\"였어요.";
}

function hasBatchim(s) {
  const c = s.charCodeAt(s.length - 1) - 0xac00;
  return c >= 0 && c <= 11171 && c % 28 !== 0;
}

function paint(j) {
  $("r-ill").src = "img/" + j.ill + ".png";
  $("r-type").textContent = TYPE[j.g];
  $("r-title").innerHTML = "<em>" + j.name + "</em>" + (hasBatchim(j.name) ? "이" : "가") + "<br>잘 맞아요";
  $("r-one").textContent = j.one;
  $("r2-ill").src = "img/" + j.ill + ".png";
  $("r-kv").innerHTML = kvRows(j);
  if (j.nums) {
    $("r-nums").innerHTML = j.nums.map(([k, v]) => '<div class="big"><span>' + k + "</span><b>" + v + "</b></div>").join("") + '<p class="cap">' + j.src + '</p><p class="honest">' + honestText(j) + "</p>";
  } else {
    $("r-nums").innerHTML = '<p class="honest">한 달 수입은 <b>지금 이 일을 하는 분들께 직접 듣고</b> 정리하고 있어요. 지어낸 숫자는 넣지 않아요.</p><p class="honest">' + honestText(j) + "</p>";
  }
  $("r-todo").innerHTML = j.steps.map((s) => '<button class="todo"><span class="ck">' + CHECK + "</span><span>" + s + "</span></button>").join("");
  $("r-todo").querySelectorAll(".todo").forEach((t) => (t.onclick = () => t.classList.toggle("done")));
  const others = ranked.filter((x) => x.id !== j.id).slice(0, 3);
  $("r-more").innerHTML = others.map((x) => '<button class="cell" data-id="' + x.id + '"><img src="img/' + x.ill + '.png" alt=""><span class="tx"><b>' + x.name + "</b><small>" + x.one + "</small></span>" + CHEV + "</button>").join("");
  $("r-more").querySelectorAll(".cell").forEach((c) => (c.onclick = () => { paint(JOBS.find((x) => x.id === c.dataset.id)); show("s-res"); }));
  const cta = j.cta || [j.name + " 이야기 알림 받기", "지금 이 일을 하고 있는 분의 하루 일과, 진짜 수입, 힘든 점을 정리해서 가장 먼저 보내 드릴게요."];
  $("open-sheet").textContent = cta[0];
  $("sh-title").textContent = cta[0];
  $("sh-desc").textContent = cta[1];
}

function result() {
  ranked = JOBS.map((j, idx) => ({ j, s: scoreJob(j), idx })).sort((a, b) => b.s - a.s || a.idx - b.idx).map((x) => x.j);
  paint(ranked[0]);
  show("s-res");
}

function openSheet(on) {
  $("dim").classList.toggle("on", on);
  $("sheet").classList.toggle("on", on);
  if (on) $("f-done").classList.remove("on");
}

$("go").onclick = () => { i = 0; ans.length = 0; render(); show("s-q"); };
const RSTEPS = ["s-res", "s-r2", "s-r3", "s-r4", "s-r5"];
document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => show(b.dataset.go)));
$("back").onclick = () => {
  const on = RSTEPS.find((id) => $(id).classList.contains("on"));
  if (on && on !== "s-res") { show(RSTEPS[RSTEPS.indexOf(on) - 1]); return; }
  if (on === "s-res") { i = Q.length - 1; render(); show("s-q"); return; }
  if (i > 0) { i--; render(); } else { show("s-start"); }
};
$("again").onclick = () => { i = 0; ans.length = 0; show("s-start"); };
$("open-sheet").onclick = () => openSheet(true);
$("dim").onclick = () => openSheet(false);
$("f-send").onclick = () => $("f-done").classList.add("on");
$("share").onclick = async () => {
  try {
    if (navigator.share) { await navigator.share({ title: document.title, text: "내 시간표에 맞는 두 번째 일, 2분이면 알려 줘요", url: location.href }); return; }
    await navigator.clipboard.writeText(location.href);
    $("share").textContent = "링크 복사됨";
  } catch (e) { $("share").textContent = "공유는 실제 페이지에서"; }
};
</script>
</body>
</html>
